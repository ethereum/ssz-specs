[build-system]
requires = ["hatchling>=1.25.0,<2"]
build-backend = "hatchling.build"

[project]
name = "eth-ssz-specs"
version = "0.0.1"
description = "Ethereum SSZ (Simple Serialize) specification and Merkleization"
readme = "README.md"
authors = [
    { name = "Ethereum Foundation", email = "security@ethereum.org" },
]
keywords = [
    "ssz",
    "simple-serialize",
    "merkleization",
    "ethereum",
    "specifications",
    "consensus",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.0,<3",
    "typing-extensions>=4.4",
]

[project.license]
file = "LICENSE"

[project.urls]
Homepage = "https://github.com/ethereum/ssz-specs"
Source = "https://github.com/ethereum/ssz-specs"
Issues = "https://github.com/ethereum/ssz-specs/issues"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
exclude = [".*", "tests/", "packages/"]

[tool.hatch.build.targets.wheel]
packages = ["src/ssz"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
# D213 is selected by exact code: the google convention would otherwise disable it.
# It forces multi-line docstring summaries onto the second line (after the opening quotes).
select = ["E", "F", "B", "W", "I", "A", "N", "D", "D213", "C", "TID"]
fixable = ["I", "B", "E", "F", "W", "D", "C", "TID"]
ignore = ["D205", "D203", "D212", "D415", "C901", "A005", "C420"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-bugbear]
# This type is immutable, so constructing one as an argument default is safe.
# Uint64 is a frozen integer type.
extend-immutable-calls = [
    "ssz.Uint64",
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
known-first-party = ["ssz", "ssz_testing"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = [".claude/"]

[tool.ty.rules]
# Flag any suppression comment that no longer matches a real diagnostic.
# Keeps the ignore set honest as the code evolves and prevents stale or duplicate suppressions.
unused-ignore-comment = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
minversion = "8.3.3"
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-branch",
    # Fillers generate JSON vectors via the fill plugin, not the unit-test run.
    # They depend on the plugin-provided ssz_test fixture, so exclude them here.
    "--ignore=tests/fillers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
timeout = 600

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 100

[tool.mdformat]
number = true
wrap = 80

[tool.uv]
required-version = ">=0.7.0"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ssz-testing = { workspace = true }

[dependency-groups]
test = [
    "pytest>=8.3.3,<9",
    "pytest-cov>=6.0.0,<7",
    "pytest-xdist>=3.6.1,<4",
    "pytest-timeout>=2.2.0,<3",
    "hypothesis>=6.138.14",
    "ssz-testing",
]
lint = [
    "ty==0.0.5",
    "ruff>=0.13.2,<1",
    "codespell>=2.4.1,<3",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    "ipython>=8.31.0,<9",
    "ipdb>=0.13",
    "tomli-w>=1.0.0",
]
