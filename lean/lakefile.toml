name = "ssz"
defaultTargets = ["conformance", "regressions"]

# The Lean specification of SSZ, and its proofs, live in EthLib as `EthLib.Consensus.Ssz`.
# This package only checks it against the Python specification and the reference tests.
[[require]]
name = "EthLib"
git = "https://github.com/ethereum/EthLib"
rev = "6b87b0d4951766864af432455c44344fd12b5cdc"

[leanOptions]
# A warning in the test code fails the build.
warningAsError = true
# An undeclared identifier becomes a silent new variable by default.
autoImplicit = false
relaxedAutoImplicit = false

[[lean_lib]]
name = "Conformance"

[[lean_lib]]
name = "Sha256Tests"
roots = ["Tests.Hash.Sha256"]

[[lean_exe]]
name = "conformance"
root = "Main"

[[lean_exe]]
name = "regressions"
root = "Tests"
