[build-system]
requires = ["hatchling>=1.25.0,<2"]
build-backend = "hatchling.build"

[project]
name = "ssz-testing"
version = "0.0.1.dev2"
description = "SSZ conformance test-vector generation for the Ethereum SSZ spec"
readme = "README.md"
authors = [
    { name = "Ethereum Foundation", email = "security@ethereum.org" },
]
keywords = ["ssz", "simple-serialize", "ethereum", "testing", "conformance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "eth-ssz-specs",
    "pydantic>=2.12.0,<3",
    "pytest>=8.3.3,<10",
    "click>=8.1.0,<9",
]

license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/ethereum/ssz-specs"
Source = "https://github.com/ethereum/ssz-specs"
Issues = "https://github.com/ethereum/ssz-specs/issues"

# No pytest11 entry point on purpose: autoloading would make every pytest run rmtree fixtures/.
[project.scripts]
fill = "ssz_testing.cli:fill"

[tool.hatch.build.targets.wheel]
packages = ["src/ssz_testing"]

[tool.uv.sources]
eth-ssz-specs = { workspace = true }
